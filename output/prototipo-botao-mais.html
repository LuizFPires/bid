<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bid · botão "+"</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:20px;background:#e9eaef;font-family:'Nunito Sans',system-ui,sans-serif;color:#191a22}
  h1{font-size:18px;margin:0 0 4px}
  p.sub{margin:0 0 18px;color:#555;font-size:13px}
  h2{font-size:14px;margin:18px 0 8px;font-weight:800}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .phone{border-radius:16px;overflow:hidden}
  .bar{display:flex;align-items:center;gap:11px;padding:14px 18px;min-height:56px}
  .badge{width:32px;height:32px;border-radius:9px;background:#1c2150;display:grid;place-items:center;flex:0 0 auto}
  .badge svg{width:20px;height:20px}
  .wm{font-weight:800;font-size:21px;letter-spacing:-0.4px}
  .cta{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 13px 0 10px;border-radius:12px;font-size:13px;font-weight:800;white-space:nowrap;box-sizing:border-box}
  .cta svg{width:18px;height:18px}
  .bell{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
  .bell svg{width:18px;height:18px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 18px 16px;font-size:14px;font-weight:700}
  .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto}
  .ic svg{width:20px;height:20px}
  .tag{font-size:11px;font-weight:800;opacity:.6;padding:0 18px 10px}
</style>
</head>
<body>
<h1>Botão "+" do topo — variações de cor</h1>
<p class="sub">Cada linha mostra tema claro e escuro, com um ícone de lista abaixo para comparar o tom.</p>

<script>
const plus='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
const user='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
const build='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/></svg>';
const leaves='<svg viewBox="0 0 32 32"><rect x="9" y="6" width="13" height="17" rx="2" fill="#fff"/><rect x="12" y="9" width="13" height="17" rx="2" fill="#fff" stroke="#1c2150" stroke-width="1.5"/></svg>';
function phone(dark, cta){
  const bg=dark?'#0e0f13':'#f3f4f6', ink=dark?'#f1f2f6':'#191a22';
  const bellBg=dark?'#17181f':'#fff', bellFg=dark?'#9a9dab':'#737682';
  const icBg=dark?'#1c2150':'#eef0fe', icFg=dark?'#aeb7ff':'#434ed1';
  return `<div class="phone" style="background:${bg};color:${ink}">
    <div class="bar"><span class="badge">${leaves}</span><span class="wm">bid</span>
      <span class="cta" style="${cta}">${plus}Proposta</span>
      <span class="bell" style="background:${bellBg};color:${bellFg}">${user}</span></div>
    <div class="row"><span class="ic" style="background:${icBg};color:${icFg}">${build}</span>Classica Construtora</div>
    <div class="tag">${dark?'tema escuro':'tema claro'}</div></div>`;
}
const V=[
 ['A · Atual — lavanda (#7d8cf5)','background:#7d8cf5;color:#141b50','background:#7c8af0;color:#e6e9ff'],
 ['B · Cheio no azul dos ícones (#434ed1, texto branco) — recomendada','background:#434ed1;color:#fff','background:#5b67e0;color:#fff'],
 ['C · Igual aos ícones — fundo suave, texto azul, contorno fino','background:#eef0fe;color:#434ed1;border:1.5px solid #c9cff8','background:#1c2150;color:#aeb7ff;border:1.5px solid #2f3780'],
 ['D · Claro: azul-marinho da logomarca (#1c2150) com texto e "+" brancos · Escuro: como a C, texto no azul da logomarca (#1c2150) — literal','background:#1c2150;color:#fff','background:#0e0f13;color:#1c2150;border:1.5px solid #1c2150'],
 ['D2 · Mesma ideia, mas no escuro o texto usa o azul da logomarca clareado (#9aa6ff) para ter contraste','background:#1c2150;color:#fff','background:#0e0f13;color:#9aa6ff;border:1.5px solid #2f3780'],
];
document.write(V.map(([t,l,d])=>`<h2>${t}</h2><div class="grid">${phone(false,l)}${phone(true,d)}</div>`).join(''));
</script>
</body>
</html>
