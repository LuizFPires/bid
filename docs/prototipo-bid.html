<title>bid</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;0,6..12,800;0,6..12,900&display=swap">
<style>
/* App de celular, UI calma: aparelho centralizado no desktop, tela cheia no telefone. Prioridade pela ordem das abas. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --surface-2:#F6F7F9;
  --ink:#191A22; --muted:#73768257; --muted:#737682; --faint:#A2A5B2;
  --line:#EBECF1; --line-2:#F1F2F6;
  --accent:#7D8CF5; --accent-deep:#434ED1; --accent-soft:#EEF0FE; --accent-ink:#141B50;
  --danger:#C62828; --danger-soft:#FBEAEA;
  --ok:#2E7D55; --ok-soft:#E7F3EC;
  --warn:#B0711C; --warn-soft:#FBF1E2;
  --shadow:0 1px 2px rgba(20,22,40,.04), 0 8px 24px rgba(20,22,40,.05);
  --radius:18px;
  --ff:"Nunito Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E0F13; --surface:#17181F; --surface-2:#1C1E26;
  --ink:#F1F2F6; --muted:#9A9DAB; --faint:#6E7180;
  --line:#262833; --line-2:#20222B;
  --accent:#7C8AF0; --accent-deep:#AEB7FF; --accent-soft:#1C2150; --accent-ink:#E6E9FF;
  --danger:#F08B8B; --danger-soft:#331B1B;
  --ok:#7FC79E; --ok-soft:#172A20;
  --warn:#E0A95C; --warn-soft:#2E2414;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E0F13; --surface:#17181F; --surface-2:#1C1E26;
  --ink:#F1F2F6; --muted:#9A9DAB; --faint:#6E7180;
  --line:#262833; --line-2:#20222B;
  --accent:#7C8AF0; --accent-deep:#AEB7FF; --accent-soft:#1C2150; --accent-ink:#E6E9FF;
  --danger:#F08B8B; --danger-soft:#331B1B;
  --ok:#7FC79E; --ok-soft:#172A20;
  --warn:#E0A95C; --warn-soft:#2E2414;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ff);font-weight:600;-webkit-font-smoothing:antialiased;line-height:1.5}
button{font-family:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:800;text-wrap:balance;letter-spacing:-.015em}
.num{font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- Device shell ---------- */
.stage{height:100%;display:flex;justify-content:center;align-items:stretch;background:var(--bg)}
.device{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media(min-width:620px){
  .stage{align-items:center;padding:26px 16px;background:linear-gradient(165deg,var(--surface-2),var(--bg))}
  .device{height:min(940px,calc(100% - 52px));border:1px solid var(--line);border-radius:42px;box-shadow:0 30px 80px rgba(16,18,40,.20)}
}
.topbar{display:flex;align-items:center;gap:11px;flex:0 0 auto;background:var(--bg);
  padding:14px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px));min-height:56px}
.topbar .logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.topbar .logo svg{width:18px;height:18px}
.topbar .name{font-weight:900;letter-spacing:.09em;font-size:15px}
.topbar .back{margin-right:auto;border:0;background:none;color:var(--ink);border-radius:9px;height:36px;padding:0 8px 0 0;font-weight:800;font-size:13.5px;display:none;align-items:center;gap:4px}
.topbar .back svg{width:17px;height:17px}
.topbar .bell{margin-left:auto;width:38px;height:38px;border-radius:12px;border:0;background:var(--surface);color:var(--muted);display:grid;place-items:center;box-shadow:var(--shadow)}
.topbar .bell svg{width:18px;height:18px}
.content{flex:1;min-width:0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px max(18px,env(safe-area-inset-left,0px)) 28px max(18px,env(safe-area-inset-right,0px))}

.tabbar{display:flex;flex:0 0 auto;background:var(--bg);border-top:1px solid var(--line);
  padding:8px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tab{flex:1;border:0;background:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:4px 2px;font-size:10.5px;font-weight:800;min-height:48px}
.tab svg{width:23px;height:23px}
.tab .tb{display:grid;place-items:center;width:52px;height:28px;border-radius:14px;transition:.15s}
.tab.on{color:var(--accent-deep)}
.tab.on .tb{background:var(--accent-soft)}

/* ---------- Headings ---------- */
.page-head{margin:8px 0 18px}
.page-head h1{font-size:27px}
.page-head p.lead{color:var(--muted);font-weight:600;margin:4px 0 0;font-size:13.5px}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted);margin:2px 0 10px;flex-wrap:wrap}
.crumb button{border:0;background:none;color:var(--accent-deep);font-weight:800;padding:0;font-size:12.5px}
.crumb svg{width:12px;height:12px;color:var(--faint)}
.sub{color:var(--muted);font-weight:700;font-size:13px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 17px;border-radius:14px;
  font-weight:800;font-size:14px;border:1px solid transparent;white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow)}
.btn.sm{min-height:38px;padding:0 13px;font-size:13px;border-radius:11px}
.btn.block{width:100%}
.btn.soft{background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}

/* ---------- Cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.section-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.section-title h2{font-size:14px;font-weight:800}
.section-title .c{margin-left:auto;color:var(--faint);font-weight:800;font-size:12px}

/* ---------- Pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:30px;line-height:1.4}
.pill.aberta{background:var(--accent-soft);color:var(--accent-ink)}
.pill.analise{background:var(--warn-soft);color:var(--warn)}
.pill.adjudicada{background:var(--ok-soft);color:var(--ok)}
.pill.neutro{background:var(--line-2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.aberta{background:var(--accent)} .dot.analise{background:var(--warn)} .dot.adjudicada{background:var(--ok)} .dot.neutro{background:var(--faint)}

/* ---------- Lists ---------- */
.rowlist{display:flex;flex-direction:column;overflow:hidden}
.rowlist .row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-top:1px solid var(--line-2);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;color:inherit;font-family:inherit}
.rowlist .row:first-child{border-top:0}
.rowlist button.row:active{background:var(--surface-2)}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:0 0 auto}
.row .ic svg{width:20px;height:20px}
.row .tt{min-width:0;flex:1}
.row .tt .t1{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tt .t2{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.row .rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
.row .rt .v{font-weight:900;font-size:14px;font-variant-numeric:tabular-nums}
.row .chev{color:var(--faint);flex:0 0 auto;margin-left:2px}
.row .chev svg{width:18px;height:18px}

/* ---------- Big cards (obra/certame) ---------- */
.ucard{padding:16px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px;width:100%;font-family:inherit;color:inherit;margin-bottom:12px}
.ucard .hd{display:flex;align-items:center;gap:12px}
.ucard .cat-ic{width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;flex:0 0 auto}
.ucard .cat-ic svg{width:23px;height:23px}
.ucard h3{font-size:15.5px}
.ucard .foot{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-weight:700;font-size:12.5px;padding-top:11px;border-top:1px solid var(--line-2)}
.ucard .foot .go{display:flex;align-items:center;gap:5px;color:var(--accent-deep);font-weight:800}
.ucard .foot .go svg{width:16px;height:16px}

/* ---------- Summary grid (proposta) ---------- */
.sumgrid{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.sumgrid>div{padding:14px 16px;display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line-2);border-left:1px solid var(--line-2)}
.sumgrid>div:nth-child(-n+2){border-top:0}
.sumgrid>div:nth-child(odd){border-left:0}
.sumgrid .k{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.sumgrid .val{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums}

/* ---------- Search / filters ---------- */
.searchbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;box-shadow:var(--shadow)}
.searchbar svg{width:18px;height:18px;color:var(--faint);flex:0 0 auto}
.searchbar input{border:0;outline:0;background:none;flex:1;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);min-width:0}
.searchbar input::placeholder{color:var(--faint);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:13px 2px 2px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ch{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:30px;padding:8px 14px;font-weight:800;font-size:12.5px;min-height:38px;white-space:nowrap;flex:0 0 auto}
.ch.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scopebar{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;font-weight:700;color:var(--muted);overflow-x:auto;scrollbar-width:none}
.scopebar::-webkit-scrollbar{display:none}
.scopebar .sc{border:0;background:none;color:var(--faint);font-weight:800;padding:4px 0;white-space:nowrap;flex:0 0 auto;border-bottom:2px solid transparent}
.scopebar .sc.on{color:var(--ink);border-bottom-color:var(--accent)}

/* ---------- Table (equalização) ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow)}
table.eq{border-collapse:collapse;width:100%;min-width:540px;font-size:12.5px}
table.eq th,table.eq td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top}
table.eq thead th{position:sticky;top:0;background:var(--surface);z-index:1;font-size:11.5px}
table.eq thead th.forn{min-width:118px}
table.eq .itm{font-weight:700;color:var(--muted)}
table.eq td.val{font-variant-numeric:tabular-nums;font-weight:700}
table.eq tr.total td{border-top:2px solid var(--line);font-weight:900;font-size:13.5px}
table.eq .best{color:var(--ok);font-weight:900}
table.eq .high{color:var(--danger);font-weight:800}
.fornhd{display:flex;flex-direction:column;gap:3px}
.fornhd .nm{font-weight:900;font-size:12.5px}
.fornhd .vz{font-size:10.5px;color:var(--faint);font-weight:700}
.mark{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px}
.mark.y{background:var(--ok-soft);color:var(--ok)} .mark.n{background:var(--danger-soft);color:var(--danger)} .mark.p{background:var(--warn-soft);color:var(--warn)}
.mark svg{width:13px;height:13px}

/* ---------- AI ---------- */
.ai{border:1px solid var(--accent);border-radius:var(--radius);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 74%);overflow:hidden}
.ai .ai-h{display:flex;align-items:center;gap:11px;padding:15px 16px;border-bottom:1px solid var(--line)}
.ai .ai-h .sp{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:0 0 auto}
.ai .ai-h .sp svg{width:19px;height:19px}
.ai .ai-h h3{font-size:14.5px}
.ai .ai-h small{color:var(--muted);font-weight:700;font-size:11px}
.ai .ai-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.ai .verdict{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;font-size:13px;font-weight:600}
.ai .verdict .tag{font-size:10.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-deep)}
.ai .verdict b{font-weight:900}
.ai .finding{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;font-weight:600}
.ai .finding .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.ai .finding .d.r{background:var(--danger)} .ai .finding .d.w{background:var(--warn)} .ai .finding .d.g{background:var(--ok)}
.ai .finding b{font-weight:900}
.ai-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:13px;padding:30px 20px}
.ai-empty .sp{width:46px;height:46px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.ai-empty .sp svg{width:25px;height:25px}
.ai-empty p{color:var(--muted);font-weight:700;font-size:12.5px;margin:0}
.thinking{display:inline-flex;gap:5px;align-items:center}
.thinking i{width:7px;height:7px;border-radius:50%;background:var(--accent-deep);animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s} .thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,60%,100%{opacity:.25} 30%{opacity:1}}

/* ---------- Timeline ---------- */
.timeline{display:flex;flex-direction:column;padding-left:2px}
.tl{display:flex;gap:13px;padding-bottom:14px;position:relative}
.tl:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:-2px;width:2px;background:var(--line)}
.tl .tdot{width:28px;height:28px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-size:10.5px;font-weight:900;color:var(--muted);flex:0 0 auto;z-index:1}
.tl.cur .tdot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl .tbody{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
.tl .tbody .th{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl .tbody .th .d{font-size:11.5px;color:var(--muted);font-weight:700;margin-left:auto}
.tl .tbody .vls{display:flex;gap:22px;flex-wrap:wrap;margin-top:9px}
.tl .tbody .vls .v{font-size:11.5px;font-weight:700;color:var(--muted)}
.tl .tbody .vls .v b{display:block;font-size:14.5px;font-weight:900;color:var(--ink)}
.tl .tbody .obs{font-size:12px;color:var(--muted);font-weight:600;margin-top:9px}
.delta.up{color:var(--danger)} .delta.down{color:var(--ok)}
.files{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.file{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2)}
.file .fi{width:28px;height:32px;border-radius:5px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-size:8px;font-weight:900;color:var(--danger)}
.file .fn{min-width:0;flex:1;font-size:12.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fn small{display:block;color:var(--muted);font-weight:700;font-size:10.5px}

/* ---------- Banner / contrato ---------- */
.banner{display:flex;gap:11px;align-items:flex-start;border-radius:14px;padding:13px 14px;font-size:12.5px;font-weight:700;margin-bottom:18px}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner svg{width:19px;height:19px;flex:0 0 auto;margin-top:1px}
.clause{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:11px;background:var(--surface);box-shadow:var(--shadow)}
.clause .cnum{font-size:10.5px;font-weight:900;color:var(--accent-deep);letter-spacing:.05em;text-transform:uppercase}
.clause h4{font-size:14px;margin:3px 0 6px}
.clause p{margin:0;font-size:12.5px;font-weight:600;color:var(--ink)}
.clause .src{margin-top:10px;font-size:11px;font-weight:800;color:var(--accent-deep);display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);padding:5px 10px;border-radius:8px}
.clause .src svg{width:12px;height:12px}
.annex{padding:13px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:11px}
.annex:last-child{border-bottom:0}
.annex .okic{color:var(--ok);display:grid;place-items:center;flex:0 0 auto}
.annex .okic svg{width:19px;height:19px}
.empty{text-align:center;padding:44px 18px;color:var(--muted);font-weight:700;font-size:13px}

.topbar .ticon{width:38px;height:38px;border-radius:12px;border:0;background:var(--accent-soft);color:var(--accent-deep);display:grid;place-items:center;margin-left:8px}
.topbar .ticon svg{width:20px;height:20px}
.party{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line-2)}
.party:last-child{border-bottom:0}
.party .pic{width:38px;height:38px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-weight:900;font-size:13px;flex:0 0 auto}
.party .pic svg{width:18px;height:18px;color:var(--ok)}
.party .pn{flex:1;min-width:0}
.party .pn .r{font-weight:800;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.party .pn .s{font-size:11.5px;color:var(--muted);font-weight:700}
.sigimg{height:36px;max-width:120px;object-fit:contain;flex:0 0 auto}
.padwrap{position:relative}
.pad{width:100%;height:200px;border:1.5px dashed var(--line);border-radius:14px;background:var(--surface);touch-action:none;display:block}
.padline{position:absolute;left:20px;right:20px;bottom:44px;border-bottom:1.5px solid var(--line);pointer-events:none}
.padhint{position:absolute;left:0;right:0;bottom:20px;text-align:center;color:var(--faint);font-weight:700;font-size:12px;pointer-events:none}
.linkbox{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:12.5px;font-weight:700}
.wa{background:#25D366;color:#083d22;border-color:#25D366}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 13px;font-family:inherit;font-size:14.5px;font-weight:700;color:var(--ink);box-shadow:var(--shadow)}
.field input:focus,.field select:focus{outline:2px solid var(--accent);outline-offset:1px}
.dropzone{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted);font-weight:800;font-size:13px;background:var(--surface-2);cursor:pointer}
.dropzone svg{width:26px;height:26px;color:var(--faint)}
.dropzone small{color:var(--faint);font-weight:700;font-size:11px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}

let stack=[];
function go(screen,params,push=true){ if(push) stack.push({screen,params}); render(screen,params||{}); updNav(screen); view.scrollTop=0;}
function back(){ stack.pop(); const prev=stack[stack.length-1]||{screen:'propostas',params:{}}; render(prev.screen,prev.params); updNav(prev.screen); view.scrollTop=0;}
function updNav(screen){
  const map={prop:'propostas',nova:'propostas',conc:'equalizacoes',equalizar:'equalizacoes',vencedora:'equalizacoes',iniciar:'equalizacoes',contrato:'contratos',novocontrato:'contratos',assinar:'contratos',enviarass:'contratos',assinado:'contratos',obra:'obras'};
  const root=['propostas','equalizacoes','contratos','obras'].includes(screen)?screen:(map[screen]||'propostas');
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav===root));
  $('#mback').style.display = ['propostas','equalizacoes','contratos','obras'].includes(screen)?'none':'inline-flex';
  const add=$('#topadd'); const amap={propostas:'nova',equalizacoes:'iniciar',contratos:'novocontrato'};
  if(amap[screen]){add.hidden=false;add.dataset.go=amap[screen];} else add.hidden=true;
}
document.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.nav)));
$('#mback').addEventListener('click',back);
$('#topadd').addEventListener('click',()=>go($('#topadd').dataset.go||'nova'));
function render(screen,p){ (SCREENS[screen]||SCREENS.propostas)(p); }

let fCat='all', fScope='todas', fQ='';
SCREENS.propostas=()=>{
  view.innerHTML=`
  <div class="page-head"><h1>Propostas</h1><p class="lead">O acervo de propostas de obra.</p></div>
  <div class="searchbar">${I.search}<input id="propq" placeholder="Buscar fornecedor, categoria, obra" value="${fQ}"></div>
  <div class="chips" id="catf">
    <button class="ch ${fCat==='all'?'on':''}" data-cat="all">Todas</button>
    ${Object.entries(CATS).map(([k,v])=>`<button class="ch ${k===fCat?'on':''}" data-cat="${k}">${v.nome}</button>`).join('')}
  </div>
  <div class="scopebar" id="scope">
    <button class="sc ${fScope==='todas'?'on':''}" data-scope="todas">Todo o sistema</button>
    ${Object.values(OBRAS).map(o=>`<button class="sc ${fScope===o.id?'on':''}" data-scope="${o.id}">${o.nome}</button>`).join('')}
  </div>
  <div id="propres"></div>`;
  renderPropList();
  $('#propq').addEventListener('input',e=>{fQ=e.target.value;renderPropList()});
  document.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{fCat=b.dataset.cat;SCREENS.propostas()}));
  document.querySelectorAll('[data-scope]').forEach(b=>b.addEventListener('click',()=>{fScope=b.dataset.scope;SCREENS.propostas()}));
};
function filteredProps(){
  let r=allProps();
  if(fCat!=='all') r=r.filter(p=>p.cat===fCat);

function ctData(arg){let ct,c,p;
  if(arg.id){ct=CONTRATOS.find(x=>x.id===arg.id);c=findConc(ct.base);p=c.propostas.find(x=>x.status==='vencedora');}

  return {ct,c,p,o:OBRAS[ct.obra]};}

  const safe=String(nome).replace(/['"\\]/g,'');
  return `<div class="party"><span class="pic">${sig?I.check:(nome[0]||'?')}</span>
    <div class="pn"><div class="r">${nome}</div><div class="s">${papel}${sig?' · assinado nas '+PAGINAS+' páginas':''}</div></div>
    ${sig?`<img class="sigimg" src="${sig}" alt="assinatura">`:`<div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto">
      <button class="btn sm primary" onclick="go('assinar',{conc:'${base}',parte:'${parte}',nome:'${safe}'})">Assinar</button>
      <button class="btn sm ghost" onclick="go('enviarass',{conc:'${base}',parte:'${parte}',nome:'${safe}'})">Enviar link</button></div>`}</div>`;
}
SCREENS.assinar=({conc,parte,nome,ext})=>{
  const {ct}=ctData({conc});
  view.innerHTML=`
  ${ext?`<div class="banner warn" style="margin-top:4px">${I.alert}<div>Documento enviado pelo <b>bid</b> para sua assinatura.</div></div>`:`<div class="crumb"><button onclick="back()">Contrato</button>${I.chev}<span>Assinar</span></div>`}
  <div class="page-head"><h1>${ext?'Assinar documento':'Sua assinatura'}</h1><p class="lead">${nome||''} · ${CATS[ct.cat].nome} · ${brl(ct.valor)}</p></div>
  <p class="sub" style="margin-bottom:9px">Assine com o dedo no quadro. A mesma assinatura é aplicada nas ${PAGINAS} páginas.</p>
  <div class="padwrap"><canvas id="pad" class="pad"></canvas><div class="padline"></div><div class="padhint" id="padhint">assine aqui</div></div>
  <div style="display:flex;gap:9px;margin:12px 0 4px"><button class="btn ghost" style="flex:1" id="clear">Limpar</button><button class="btn primary" style="flex:2" id="confirm">${I.check} Confirmar</button></div>`;
  setupPad(conc,parte,ext);
};
function setupPad(conc,parte,ext){
  const cv=$('#pad'),hint=$('#padhint'),ctx=cv.getContext('2d');
  const r=cv.getBoundingClientRect();cv.width=r.width*2;cv.height=r.height*2;ctx.scale(2,2);
  ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#171821';
  let drawing=false,empty=true,last=null;
  const pos=e=>{const b=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:t.clientX-b.left,y:t.clientY-b.top}};
  cv.addEventListener('pointerdown',e=>{drawing=true;empty=false;hint.style.display='none';last=pos(e);e.preventDefault();});
  cv.addEventListener('pointermove',e=>{if(!drawing)return;const q=pos(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(q.x,q.y);ctx.stroke();last=q;e.preventDefault();});
  window.addEventListener('pointerup',()=>{drawing=false;});
  $('#clear').addEventListener('click',()=>{ctx.clearRect(0,0,cv.width,cv.height);empty=true;hint.style.display='';});
  $('#confirm').addEventListener('click',()=>{if(empty){toast('Assine no quadro primeiro');return;}
    sigState(conc)[parte]=cv.toDataURL('image/png');
    if(ext)go('assinado',{conc,parte});else{toast('Assinatura registrada');setTimeout(()=>go('contrato',{conc}),600);}});
}
SCREENS.assinado=({conc})=>{
  view.innerHTML=`
  <div style="text-align:center;margin-top:42px">
    <div style="width:66px;height:66px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 16px">${I.check}</div>
    <h1 style="font-size:24px">Assinatura concluída</h1>
    <p class="lead" style="margin-top:6px">O documento foi assinado e já aparece assinado no bid.</p>
  </div>
  <button class="btn primary block" style="margin-top:22px" onclick="go('contrato',{conc:'${conc}'})">Ver no contrato</button>`;
};
SCREENS.enviarass=({conc,parte,nome})=>{
  const {ct}=ctData({conc}); const link='bid.app/a/'+String(conc).replace(/[^a-z0-9]/gi,'').slice(0,8);
  const msg=encodeURIComponent('Segue o contrato de '+CATS[ct.cat].nome+' para assinatura digital: https://'+link);
  view.innerHTML=`
  <div class="crumb"><button onclick="back()">Contrato</button>${I.chev}<span>Enviar p/ assinatura</span></div>
  <div class="page-head"><h1>Enviar para assinatura</h1><p class="lead">Para quem não usa o bid: a outra parte assina pelo navegador.</p></div>
  <div class="field"><label>Link de assinatura</label><div class="linkbox"><span style="flex:1;min-width:0;word-break:break-all">${link}</span><button class="btn sm ghost" id="copy">Copiar</button></div></div>
  <a class="btn wa block" href="https://wa.me/?text=${msg}" target="_blank" rel="noopener" style="margin-bottom:10px"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.7 7.4L3 21l2.2-5.2A8.5 8.5 0 1 1 21 11.5z"/></svg> Compartilhar no WhatsApp</a>
  <p class="sub" style="text-align:center;margin-bottom:14px">A outra parte abre o link, assina com o dedo e confirma — o documento aparece assinado aqui.</p>
  <button class="btn ghost block" id="simular">Simular: abrir como a outra parte</button>`;
  $('#copy').addEventListener('click',()=>{try{navigator.clipboard.writeText('https://'+link)}catch(e){}toast('Link copiado')});
  $('#simular').addEventListener('click',()=>go('assinar',{conc,parte,nome,ext:true}));
};

/* ===== Iniciar equalização ===== */
let eqScope='obra', eqObra='jardins', eqCatName='Estrutura pré-moldada';
SCREENS.iniciar=()=>{
  const inObra = eqScope==='obra'; const nm=eqCatName.trim().toLowerCase();
  let matches=[], concId=null;
  if(inObra){const c=OBRAS[eqObra].concs.find(x=>CATS[x.cat].nome.toLowerCase()===nm); if(c){concId=c.id; matches=c.propostas.map(p=>({...p,obraNome:OBRAS[eqObra].nome}))}}
  else matches=allProps().filter(p=>CATS[p.cat].nome.toLowerCase()===nm);
  view.innerHTML=`
  <div class="crumb"><button data-nav="equalizacoes">Equalizações</button>${I.chev}<span>Iniciar</span></div>
  <div class="page-head"><h1>Iniciar equalização</h1><p class="lead">Escolha o que comparar.</p></div>
  <div class="field"><label>Escopo</label>
    <div class="seg"><button class="${inObra?'on':''}" data-sc="obra">Em uma obra</button><button class="${!inObra?'on':''}" data-sc="entre">Entre obras</button></div></div>
  ${inObra?`<div class="field"><label>Obra</label><select id="i-obra">${Object.values(OBRAS).map(o=>`<option value="${o.id}" ${o.id===eqObra?'selected':''}>${o.nome}</option>`).join('')}</select></div>`:''}
  <div class="field"><label>Categoria de serviço</label><input id="i-cat" list="cats2" value="${eqCatName}" placeholder="Digite ou escolha" autocomplete="off"><datalist id="cats2">${[...new Set(allProps().map(p=>CATS[p.cat].nome))].map(n=>`<option value="${n}"></option>`).join('')}</datalist></div>
  <div class="section-title"><h2>Propostas a comparar</h2><span class="c">${matches.length}</span></div>
  ${matches.length?`<div class="card rowlist" style="margin-bottom:16px">${matches.sort((a,b)=>a.valor-b.valor).map(p=>`<div class="row">
      <span class="ic" style="background:var(--ok-soft);color:var(--ok)">${I.check}</span>
      <span class="tt"><span class="t1">${p.forn}</span><span class="t2">${p.obraNome}${p.vz>1?' · v'+p.vz:''}</span></span>
      <span class="rt"><span class="v">${brl(p.valor)}</span></span></div>`).join('')}</div>`
    :`<div class="card empty" style="margin-bottom:16px">Nenhuma proposta nessa categoria${inObra?' nesta obra':''}.</div>`}
  <button class="btn primary block" id="start" ${matches.length<2?'disabled style="opacity:.45"':''}>${I.scale} Equalizar ${matches.length} propostas</button>`;
  document.querySelectorAll('[data-sc]').forEach(b=>b.addEventListener('click',()=>{eqScope=b.dataset.sc;SCREENS.iniciar()}));
  const so=$('#i-obra'); if(so) so.addEventListener('change',()=>{eqObra=so.value;SCREENS.iniciar()});
  $('#i-cat').addEventListener('change',e=>{eqCatName=e.target.value;SCREENS.iniciar()});
  const st=$('#start'); if(st) st.addEventListener('click',()=>{if(matches.length<2)return;
    if(inObra&&concId) go('equalizar',{id:concId}); else toast('Equalização entre obras — comparativo de '+matches.length+' propostas (protótipo)');});
};

  view.innerHTML=`
  <div class="crumb"><button data-nav="propostas">Propostas</button>${I.chev}<span>Nova proposta</span></div>
  <div class="page-head"><h1>Nova proposta</h1><p class="lead">Diga a obra e a categoria e anexe o arquivo — a IA lê o resto da proposta.</p></div>
  <div class="field"><label>Obra</label><select id="f-obra">${Object.values(OBRAS).map(o=>`<option value="${o.id}">${o.nome}</option>`).join('')}</select></div>
  <div class="field"><label>Categoria de serviço</label><input id="f-cat" list="cats" placeholder="Digite ou escolha — ex.: Impermeabilização" autocomplete="off"><datalist id="cats">${[...new Set(allProps().map(p=>CATS[p.cat].nome))].map(n=>`<option value="${n}"></option>`).join('')}</datalist></div>
  <div class="field"><label>Arquivo da proposta</label>
    <label class="dropzone" for="f-file">${I.upload}<div>Anexar PDF ou planilha</div><small>a IA extrai fornecedor, valor, prazo, pagamento e garantia</small></label>
    <input id="f-file" type="file" hidden></div>
  <div id="extract"></div>
  <button class="btn ghost block" id="cancel0" style="margin-top:4px">Cancelar</button>`;
  $('#cancel0').addEventListener('click',back);
  $('#f-file').addEventListener('change',e=>{if(e.target.files.length){document.querySelector('.dropzone div').textContent=e.target.files[0].name;extrairProposta()}});
};
function extrairProposta(){
  const ex=$('#extract');
  ex.innerHTML=`<div class="ai" style="margin:4px 0 14px"><div class="ai-empty"><span class="sp">${I.spark}</span><div class="thinking"><i></i><i></i><i></i></div><p>Lendo a proposta e extraindo os dados…</p></div></div>`;
  setTimeout(()=>{
    const d=[['Fornecedor','Metalça Esquadrias',14],['Valor','R$ 436.800',16],['Prazo','43 dias',14],['Pagamento','30% / 70%',14],['Garantia','4 anos',14],['Planilha','18 itens',14]];
    ex.innerHTML=`
    <div class="ai" style="margin:4px 0 14px"><div class="ai-h"><span class="sp">${I.spark}</span><div><h3>Dados lidos pela IA</h3><small>Claude · confira antes de arquivar</small></div></div>
      <div class="ai-b" style="padding:0;gap:0"><div class="sumgrid" style="border:0">
        ${d.map(([k,v,s])=>`<div><span class="k">${k}</span><span class="val" style="font-size:${s}px">${v}</span></div>`).join('')}
      </div></div></div>
    <button class="btn ghost block" style="margin-bottom:9px" onclick="toast('Corrigir dados lidos (protótipo)')">Corrigir dados lidos</button>
    <button class="btn primary block" id="save">${I.check} Arquivar no acervo</button>`;
    $('#save').addEventListener('click',()=>{toast('Proposta arquivada no acervo');setTimeout(()=>go('propostas'),800)});
  },1400);
}
function bindConc(){document.querySelectorAll('[data-conc]').forEach(b=>{if(!b.dataset.prop)b.addEventListener('click',()=>go('conc',{id:b.dataset.conc}))})}
function bindProp(){document.querySelectorAll('[data-prop]').forEach(b=>b.addEventListener('click',()=>go('prop',{id:b.dataset.prop,conc:b.dataset.conc})))}

let tt;
function toast(msg){let el=$('#toast');if(!el){el=document.createElement('div');el.id='toast';(document.querySelector('.device')||document.body).appendChild(el)}
  el.textContent=msg;el.style.opacity='1';clearTimeout(tt);tt=setTimeout(()=>el.style.opacity='0',2400)}
window.go=go; window.toast=toast; window.back=back;
go('propostas',{},true);
</script>
